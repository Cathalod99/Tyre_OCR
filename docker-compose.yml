version: '3.8'

services:
  tire-ocr-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/ocrtyre-9369d891cdc1.json
    volumes:
      - ./ocrtyre-9369d891cdc1.json:/app/ocrtyre-9369d891cdc1.json:ro
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./ML:/app/ML:ro
      - ./OCR:/app/OCR:ro
      - ./Yolo:/app/Yolo:ro
      - ./plant_codes.py:/app/plant_codes.py:ro
      - ./convert.py:/app/convert.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
