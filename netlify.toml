[build]
  # Use the mobile_web_app directory as the source
  base = "mobile_web_app"
  publish = "."
  command = "echo 'Static site - no build needed'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  # Add your backend API URL here
  REACT_APP_API_URL = "https://tyreocr-production.up.railway.app"
